name: Arena Service

on:
  push:
    branches: [main]
    paths:
      - 'arena-service/**'
      - 'pom.xml'
  pull_request:
    branches: [main]
    paths:
      - 'arena-service/**'
      - 'pom.xml'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -pl arena-service -am test --no-transfer-progress

